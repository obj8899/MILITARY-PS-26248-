<svg width="1600" height="420" viewBox="0 0 1600 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sudarshan Command Deck banner</title>
  <desc id="desc">Dark terrain-themed banner with electric amber accents and the tagline: When the signal isn't the whole story.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#11161A"/>
      <stop offset="45%" stop-color="#1A261E"/>
      <stop offset="100%" stop-color="#0F1713"/>
    </linearGradient>
    <linearGradient id="terrain" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#2A3B2E"/>
      <stop offset="100%" stop-color="#15231A"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="420" fill="url(#bg)"/>

  <g opacity="0.75">
    <path d="M0 310 C220 270, 260 220, 430 260 S760 315, 960 265 S1290 220, 1600 290 L1600 420 L0 420 Z" fill="url(#terrain)"/>
    <path d="M0 332 C220 295, 330 260, 460 290 S760 340, 960 300 S1290 255, 1600 335 L1600 420 L0 420 Z" fill="#1B2A20" opacity="0.9"/>
  </g>

  <g opacity="0.1" stroke="#FCD34D" stroke-width="2">
    <path d="M100 90 L350 90"/>
    <path d="M100 120 L420 120"/>
    <path d="M100 150 L370 150"/>
  </g>

  <g transform="translate(110 95)">
    <rect x="0" y="0" width="198" height="198" rx="28" fill="#0F1713" stroke="#FBBF24" stroke-width="3"/>
    <rect x="26" y="26" width="146" height="146" rx="18" fill="none" stroke="#FBBF24" stroke-opacity="0.7" stroke-width="2"/>
    <path d="M48 118 L77 82 L107 118 L128 83 L152 118" fill="none" stroke="url(#amber)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle cx="126" cy="78" r="13" fill="#FCD34D" opacity="0.9"/>
    <path d="M57 147 L152 147" stroke="#D9E2EA" stroke-opacity="0.8" stroke-width="6" stroke-linecap="round"/>
    <path d="M65 160 L108 160" stroke="#FBBF24" stroke-width="6" stroke-linecap="round"/>
  </g>

  <g transform="translate(360 92)">
    <text x="0" y="118" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="1.5" fill="#F8FAFC">SUDARSHAN</text>
    <text x="0" y="183" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="1.5" fill="#FCD34D">COMMAND DECK</text>
    <rect x="0" y="205" width="500" height="4" fill="url(#amber)"/>
    <text x="0" y="260" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="28" font-weight="500" letter-spacing="2" fill="#CAD5D2">WHEN THE SIGNAL ISN'T THE WHOLE STORY.</text>
  </g>

  <g transform="translate(1180 85)">
    <g opacity="0.9">
      <circle cx="0" cy="0" r="48" fill="none" stroke="#FBBF24" stroke-width="3" opacity="0.75"/>
      <circle cx="0" cy="0" r="72" fill="none" stroke="#FBBF24" stroke-width="2" opacity="0.45"/>
      <circle cx="0" cy="0" r="8" fill="#FCD34D"/>
      <path d="M0 -40 L0 40 M-40 0 L40 0 M-28 -28 L28 28 M-28 28 L28 -28" stroke="#FCD34D" stroke-width="2.6" opacity="0.9"/>
    </g>
  </g>

  <g transform="translate(1110 260)" fill="#DCE8E0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" letter-spacing="1.8">
    <text x="0" y="0">ILLUSTRATIVE SIMULATION</text>
    <text x="0" y="36" fill="#FBBF24">SCRIPTED EXERCISE</text>
  </g>
</svg>
